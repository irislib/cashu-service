[workspace]
members = [
  "crates/cashu-credit",
  "crates/cashu-service",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://git.iris.to/#/npub1xdhnr9mrv47kkrn95k6cwecearydeh8e895990n3acntwvmgk2dsdeeycm/cashu-service"
homepage = "https://git.iris.to/#/npub1xdhnr9mrv47kkrn95k6cwecearydeh8e895990n3acntwvmgk2dsdeeycm/cashu-service"
authors = ["Martti Malmi"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
cdk-spilman = { version = "0.16.0", default-features = false }
cdk = { version = "=0.16.0-rc.1", package = "cdk", default-features = false }
cashu = { version = "=0.16.0-rc.1", package = "cashu", default-features = false }
cdk-common = { version = "=0.16.0-rc.1", package = "cdk-common", default-features = false }
cdk-sqlite = { version = "=0.16.0-rc.1", package = "cdk-sqlite", default-features = false }
hex = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
thiserror = "1.0"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread"] }
uuid = { version = "1.0", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
