[package]
name = "cashu-service"
version = "0.4.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Reusable Cashu helper and wallet primitives for paid connectivity services"

[features]
default = []
credit-store = ["dep:cashu-credit", "dep:rusqlite", "dep:thiserror"]
credit-settlement = ["credit-store", "wallet"]
wallet = [
  "dep:cdk",
  "dep:cdk-sqlite",
  "dep:fs2",
  "dep:rand",
  "dep:url",
  "dep:hex",
  "dep:uuid",
]
simulation = [
  "credit-settlement",
  "dep:axum",
  "dep:cdk-axum",
  "dep:cdk-common",
  "dep:futures",
  "cdk/mint",
  "cdk-sqlite/mint",
  "tokio/net",
]
spilman = ["dep:cdk-spilman"]
spilman-wallet = ["spilman", "cdk-spilman/wallet", "dep:rand", "dep:hex"]
spilman-wallet-http = ["spilman-wallet", "dep:reqwest"]
spilman-configurable-host = [
  "spilman",
  "cdk-spilman/configurable-host",
  "dep:cashu",
  "dep:hex",
  "dep:rand",
]
spilman-configurable-host-reqwest = [
  "spilman-configurable-host",
  "cdk-spilman/configurable-host-reqwest",
]
spilman-axum = ["spilman-configurable-host", "cdk-spilman/spilman-axum"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }

axum = { version = "0.8", optional = true }
cdk-axum = { version = "=0.17.3", default-features = false, optional = true }
cdk-common = { workspace = true, features = ["mint"], optional = true }
cdk-spilman = { workspace = true, optional = true }
cashu-credit = { path = "../cashu-credit", version = "0.3.0", optional = true }
cashu = { workspace = true, optional = true }
cdk = { workspace = true, features = ["wallet"], optional = true }
cdk-sqlite = { workspace = true, features = ["wallet"], optional = true }
futures = { version = "0.3", optional = true }
hex = { workspace = true, optional = true }
fs2 = { workspace = true, optional = true }
rand = { version = "0.8", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }
rusqlite = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
url = { version = "2", optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
cdk-common.workspace = true
tempfile.workspace = true
tokio = { version = "1", features = ["full"] }
